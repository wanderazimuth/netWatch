[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatch"
version = "0.1.0"
description = "Fing replacement to watch devices enter and leave my home network"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
deco = ["tplinkrouterc6u>=5.36"]

[project.scripts]
netwatch = "netwatch.__main__:main"

[tool.setuptools]
packages = ["netwatch"]

[tool.setuptools.package-data]
netwatch = ["static/*"]
