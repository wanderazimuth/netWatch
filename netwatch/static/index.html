<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetWatch</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --border: #e3e6ec;
    --accent: #2f6fde; --on: #1f9d55; --off: #a0a7b5; --new: #d97706; --row-hover: #f1f4f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e4e7ee; --muted: #8b93a5; --border: #2a303b;
      --accent: #6b9cff; --on: #3ccf7a; --off: #5b6372; --new: #f5a524; --row-hover: #212632;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .updated { color: var(--muted); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; min-width: 0; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=search] { flex: 1; min-width: 160px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
                       background: var(--bg); color: var(--text); font: inherit; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 12px; font: inherit; cursor: pointer; }
  .seg button.active { background: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px;
       border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
  th.sorted::after { content: " \25BE"; }
  th.sorted.asc::after { content: " \25B4"; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: var(--row-hover); }
  tr.offline td { color: var(--muted); }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
  .dot.on { background: var(--on); box-shadow: 0 0 0 3px color-mix(in srgb, var(--on) 20%, transparent); }
  .name { cursor: text; border-bottom: 1px dashed transparent; }
  .name:hover { border-bottom-color: var(--muted); }
  .sub { color: var(--muted); font-size: 12px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-left: 6px;
         border: 1px solid var(--border); color: var(--muted); }
  .tag.new { border-color: var(--new); color: var(--new); }
  .name-input { font: inherit; padding: 3px 6px; width: 100%; max-width: 240px; border: 1px solid var(--accent);
                border-radius: 5px; background: var(--bg); color: var(--text); }
  .events { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow-y: auto; }
  .events li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .events .ic { text-align: center; }
  .events .when { color: var(--muted); font-size: 12px; }
  .k-new .ic { color: var(--new); } .k-online .ic { color: var(--on); } .k-offline .ic { color: var(--off); } .k-ip_change .ic { color: var(--accent); }
  .empty { color: var(--muted); padding: 16px 0; text-align: center; }
  .error { background: #c0392b; color: #fff; padding: 8px 12px; border-radius: 7px; margin-top: 12px; display: none; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>NetWatch</h1>
    <span class="updated" id="updated">Loading…</span>
  </header>
  <div class="error" id="error"></div>

  <section class="stats">
    <div class="stat"><div class="v" id="s-online">–</div><div class="k">Online now</div></div>
    <div class="stat"><div class="v" id="s-known">–</div><div class="k">Known devices</div></div>
    <div class="stat"><div class="v" id="s-new">–</div><div class="k">New in last 24h</div></div>
    <div class="stat"><div class="v" id="s-events">–</div><div class="k">Events in last 24h</div></div>
  </section>

  <div class="layout">
    <section class="panel">
      <div class="toolbar">
        <input type="search" id="q" placeholder="Search name, IP, MAC, vendor…">
        <div class="seg" id="filter">
          <button data-f="all" class="active">All</button>
          <button data-f="online">Online</button>
          <button data-f="offline">Offline</button>
        </div>
      </div>
      <table>
        <thead><tr>
          <th data-k="online" style="width:28px"></th>
          <th data-k="name">Name</th>
          <th data-k="ip" class="sorted asc">IP</th>
          <th data-k="mac" class="hide-sm">MAC</th>
          <th data-k="first_seen" class="hide-sm">First seen</th>
          <th data-k="last_seen">Last seen</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No devices match.</div>
    </section>

    <section class="panel">
      <h2>Activity</h2>
      <ul class="events" id="events"></ul>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const DAY = 86400;
const ICONS = { new: "★", online: "▲", offline: "▼", ip_change: "⇄" };
const VERBS = { new: "joined for the first time", online: "came online", offline: "went offline", ip_change: "changed IP to" };

let devices = [], serverNow = 0, filter = "all", sortKey = "ip", sortAsc = true, editing = null;

function el(tag, props = {}, ...children) {
  const n = document.createElement(tag);
  Object.assign(n, props);
  for (const c of children) if (c != null) n.append(c);
  return n;
}

function ago(ts) {
  const s = Math.max(0, serverNow - ts);
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < DAY) return Math.round(s / 3600) + " h ago";
  if (s < 7 * DAY) return Math.round(s / DAY) + " d ago";
  return new Date(ts * 1000).toLocaleDateString();
}
const fullTime = (ts) => new Date(ts * 1000).toLocaleString();

function ipNum(ip) {
  return ip ? ip.split(".").reduce((a, o) => a * 256 + Number(o), 0) : Infinity;
}

function compare(a, b) {
  let x = a[sortKey], y = b[sortKey];
  if (sortKey === "ip") { x = ipNum(x); y = ipNum(y); }
  if (sortKey === "name") { x = x.toLowerCase(); y = y.toLowerCase(); }
  if (x < y) return sortAsc ? -1 : 1;
  if (x > y) return sortAsc ? 1 : -1;
  return ipNum(a.ip) - ipNum(b.ip);
}

function renderDevices() {
  if (editing) return;  // don't clobber an in-progress label edit
  const q = $("q").value.trim().toLowerCase();
  const list = devices
    .filter((d) => filter === "all" || (filter === "online") === d.online)
    .filter((d) => !q || [d.name, d.ip, d.mac, d.vendor, d.hostname].some((v) => v && v.toLowerCase().includes(q)))
    .sort(compare);

  const body = $("rows");
  body.replaceChildren(...list.map((d) => {
    const nameCell = el("td", {},
      el("span", { className: "name", textContent: d.name, title: "Click to rename" }),
      serverNow - d.first_seen < DAY ? el("span", { className: "tag new", textContent: "new" }) : null,
      d.randomized ? el("span", { className: "tag", textContent: "private MAC", title: "Randomized MAC — likely a phone or laptop with Wi-Fi privacy on" }) : null,
      d.label && (d.hostname || d.vendor) ? el("div", { className: "sub", textContent: d.hostname || d.vendor }) : null,
      !d.label && d.hostname && d.vendor ? el("div", { className: "sub", textContent: d.vendor }) : null,
    );
    nameCell.querySelector(".name").onclick = () => startEdit(nameCell, d);
    return el("tr", { className: d.online ? "" : "offline" },
      el("td", {}, el("span", { className: "dot" + (d.online ? " on" : ""), title: d.online ? "Online" : "Offline" })),
      nameCell,
      el("td", { className: "mono", textContent: d.ip || "" }),
      el("td", { className: "mono hide-sm", textContent: d.mac }),
      el("td", { className: "hide-sm", textContent: ago(d.first_seen), title: fullTime(d.first_seen) }),
      el("td", { textContent: d.online ? "now" : ago(d.last_seen), title: fullTime(d.last_seen) }),
    );
  }));
  $("empty").hidden = list.length > 0;

  document.querySelectorAll("th").forEach((th) => {
    th.classList.toggle("sorted", th.dataset.k === sortKey);
    th.classList.toggle("asc", th.dataset.k === sortKey && sortAsc);
  });
}

function startEdit(cell, d) {
  editing = d.mac;
  const input = el("input", { className: "name-input", value: d.label || "", placeholder: d.hostname || d.vendor || d.mac });
  cell.replaceChildren(input);
  input.focus();
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    if (save && input.value.trim() !== (d.label || "")) {
      try {
        const r = await fetch(`/api/devices/${d.mac}/label`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ label: input.value }),
        });
        if (!r.ok) throw new Error((await r.json()).error || r.status);
      } catch (e) { showError("Rename failed: " + e.message); }
    }
    editing = null;
    refresh();
  };
  input.onkeydown = (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
  input.onblur = () => finish(true);
}

function renderEvents(events) {
  const list = $("events");
  if (!events.length) return list.replaceChildren(el("li", { className: "empty", textContent: "No activity yet." }));
  list.replaceChildren(...events.map((e) => el("li", { className: "k-" + e.kind },
    el("span", { className: "ic", textContent: ICONS[e.kind] || "•" }),
    el("div", {},
      el("div", {}, el("strong", { textContent: e.name }), " " + VERBS[e.kind] + (e.kind === "ip_change" ? " " + e.ip : "")),
      el("div", { className: "when", textContent: ago(e.ts), title: fullTime(e.ts) }),
    ),
  )));
}

function showError(msg) {
  $("error").textContent = msg;
  $("error").style.display = msg ? "block" : "none";
}

async function refresh() {
  try {
    const [d, e] = await Promise.all([
      fetch("/api/devices").then((r) => r.json()),
      fetch("/api/events?limit=200").then((r) => r.json()),
    ]);
    devices = d.devices;
    serverNow = d.now;
    $("s-online").textContent = devices.filter((x) => x.online).length;
    $("s-known").textContent = devices.length;
    $("s-new").textContent = devices.filter((x) => serverNow - x.first_seen < DAY).length;
    $("s-events").textContent = e.events.filter((x) => serverNow - x.ts < DAY).length;
    renderDevices();
    renderEvents(e.events);
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    showError("");
  } catch (err) {
    showError("Can't reach NetWatch: " + err.message);
  }
}

$("q").oninput = renderDevices;
$("filter").onclick = (e) => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll("#filter button").forEach((b) => b.classList.toggle("active", b === e.target));
  renderDevices();
};
document.querySelectorAll("th").forEach((th) => th.onclick = () => {
  if (sortKey === th.dataset.k) sortAsc = !sortAsc;
  else { sortKey = th.dataset.k; sortAsc = !["online", "last_seen", "first_seen"].includes(sortKey); }
  renderDevices();
});

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
