# Copy to /etc/netwatch/config.toml on the Pi (or ./config.toml for local runs).
# config.toml is gitignored -- never commit the real one.

# Interface and subnet to ARP-scan. Use the wired interface; the Pi is also
# on wlan0 in the same subnet, and scanning both would double-count devices.
interface = "eth0"
network = "192.168.0.0/24"

# Seconds between scans.
scan_interval = 60

# A device is marked offline after it has been unseen this long. Phones drop
# off Wi-Fi when asleep, so keep this well above scan_interval.
offline_after = 600

db_path = "/var/lib/netwatch/netwatch.db"

# Optional push notifications via ntfy (https://ntfy.sh). Use a long random
# topic name -- anyone who knows it can read your alerts. Which events are
# pushed (and snooze / quiet hours) is set from the dashboard's Alerts panel.
# ntfy_url = "https://ntfy.sh/netwatch-change-me-to-something-random"
# dashboard_url = "http://192.168.0.10:8080"   # opened when you tap an alert

# Optional: pull device names and connection type (wired / 2.4 / 5 GHz) from a
# TP-Link Deco mesh. Uses the Deco's unofficial local API. The password is the
# Deco owner's password (usually your TP-Link ID password) -- keep it in its own
# file readable only by root and the netwatch group:
#   sudo nano /etc/netwatch/deco_password
#   sudo chown root:netwatch /etc/netwatch/deco_password
#   sudo chmod 640 /etc/netwatch/deco_password
# [deco]
# url = "http://192.168.0.1"
# password_file = "/etc/netwatch/deco_password"
# poll_interval = 300

# Optional: pull hostnames and vendors from Pi-hole's v6 API.
# Create an app password in Pi-hole: Settings > Web interface / API > Configure app password.
# Also needed for the dashboard's per-device DNS lookups and "Pause internet".
# [pihole]
# url = "http://127.0.0.1"
# password = "app-password-here"
# If you copy Pi-hole settings to a second Pi-hole (e.g. nebula-sync), NetWatch
# can touch this file after pausing/resuming so a systemd path unit syncs at once.
# sync_trigger = "/var/lib/netwatch/pihole-changed"
